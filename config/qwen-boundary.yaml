# redstring's own default chunker, on qwen3-embedding-0.6b.
#
# The cell that re-tests RESULTS.md finding 3 a second time. On Nemotron,
# `boundary-preference` came LAST of three chunkers on dense retrieval,
# beaten by a whole-document cap and by a naive sliding window at double the
# granularity -- and finding 4 ruled out both obvious explanations (not lost
# content, not chunk length). `nomic-boundary` re-tests that on nomic; this
# re-tests it on a third model.
#
# Three models agreeing that boundary-preference is the outlier is a property
# of the chunker and worth chasing to a passage-level diagnostic in redstring
# itself. Three models disagreeing localises it to an interaction, which is a
# different and also interesting answer. One model alone could not tell those
# apart, which is why this arm exists rather than being assumed.
#
# No cap is set: `boundary-preference` picks its own boundaries. qwen's
# 32,768-token context means the engine's re-split will almost certainly
# never fire here -- unlike on nomic, where it was load-bearing.
name: qwen-boundary
dataset: prime
split: test-0.1
chunker: boundary-preference
embeddings: qwen3-embedding-0.6b
dimension: 1024
aggregation: max
agent: dense
k: 20

# See `qwen-wholedoc.yaml` for why the document side is empty and the query
# side carries an instruction. Every qwen config states both.
document_prefix: ""
query_prefix: "Instruct: Given a query, retrieve relevant documents that answer the query\nQuery: "
