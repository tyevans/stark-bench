services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: stark
      POSTGRES_PASSWORD: stark
      POSTGRES_DB: stark
    ports: ["55432:5432"]
    # Docker's default 64M defeats a parallel HNSW build: the workers hand
    # tuples through shared memory and the build dies with DiskFullError
    # naming a shm segment, on a host with 131G free.
    #
    # It must also exceed maintenance_work_mem, because a PARALLEL build
    # allocates that much *shared* memory rather than backend-local -- 2G
    # here failed against a 12G setting with the identical error, which
    # reads as a disk problem and is not one. See
    # scripts/build_ann_indexes.py.
    shm_size: 16gb
    volumes: ["stark-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stark"]
      interval: 5s
      retries: 20
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/starkbench
    ports: ["57474:7474", "57687:7687"]
    volumes: ["stark-neo4jdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 20

# Named, so the data outlives the containers.
#
# There were no volumes here at all until an ingested corpus was destroyed by
# a `docker compose down`: both stores wrote to anonymous volumes, which are
# removed with the container. 589,790 embedded chunks across four tenants
# went with them, and nothing warned -- the next run simply failed to connect.
#
# Scored results were unaffected, because `results/*.json` and the persisted
# predictions are files in the repo rather than rows in the store. That split
# is worth preserving: anything expensive enough to hurt when lost should not
# live only in a container.
volumes:
  stark-pgdata:
  stark-neo4jdata:
